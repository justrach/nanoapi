name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          # Track Zig's 0.17 development compiler until a stable release is cut.
          version: master
      - run: zig fmt --check build.zig src bench
      - run: zig build
      - run: zig build test
